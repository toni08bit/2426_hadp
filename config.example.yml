# Copy this file to config.yml and fill in your values.
# The UI never edits host_url, token, or interval — only the printer.

host_url: "https://example.invalid"
poll_interval_seconds: 5
bearer_token: "replace-with-your-token"

# Optional default printer (Windows printer name). Can also be chosen in the UI.
printer: ""

# forest-dark or forest-light
theme: forest-dark
